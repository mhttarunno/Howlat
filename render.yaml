# Render Blueprint for the Howlat API. Secrets are set in the Render dashboard (sync: false).
services:
  - type: web
    name: howlat-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: APP_ENV
        value: production
      - key: APP_TIMEZONE
        value: Asia/Dhaka
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: ALLOW_REGISTRATION
        value: "true"
