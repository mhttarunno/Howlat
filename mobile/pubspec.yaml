name: howlat_mobile
description: "Howlat - Native Frosted Glass Fintech Ledger Mobile App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # Networking & Authentication
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  uuid: ^4.5.1

  # State Management & Routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Financial Precision (Zero Float Errors)
  decimal: ^3.0.2
  intl: ^0.19.0

  # UI, Icons, Typography & Charts
  lucide_icons: ^0.300.0
  google_fonts: ^6.2.1
  fl_chart: ^0.69.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
